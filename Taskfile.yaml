version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:golangci-config:
    desc: golangci-lint configuration check
    cmds:
      - golangci-lint config verify

  # Both targets typecheck cmd/website, whose go:embed patterns fail on an empty
  # dist/ or prerendered/, so the frontend has to exist before either one runs.
  lint:vet:
    desc: Go vet
    deps: [web:build, prerender]
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    deps: [web:build, prerender]
    cmds:
      - golangci-lint run ./...

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:docker:
    desc: Dockerfile lint
    cmds:
      - hadolint Dockerfile

  lint:shell:
    desc: Shell lint and format check over scripts/
    cmds:
      - shellcheck scripts/*.sh
      - shfmt --diff --indent 2 --case-indent scripts/*.sh

  lint:helm:
    desc: Helm chart lint
    cmds:
      - helm lint charts/simon-ostendorf.de

  validate:kubeconform:
    desc: Schema validation of the rendered Helm chart
    cmds:
      - helm template charts/simon-ostendorf.de | kubeconform -strict -summary

  # helm-unittest is a Helm plugin, and helm only finds a plugin inside HELM_PLUGINS.
  # The mise entry's postinstall copies it into helm's own plugin directory, but that
  # hook runs only on a fresh install: a cached tool skips it. This builds a plugin
  # directory holding exactly one entry, pointing at whatever mise resolved, so the
  # target no longer depends on the hook having run.
  helm:plugins:
    desc: Link helm-unittest into a plugin directory helm can read
    internal: true
    run: once
    cmds:
      - rm -rf .task/helm-plugins
      - mkdir -p .task/helm-plugins
      - ln -s "$(mise where 'github:helm-unittest/helm-unittest')" .task/helm-plugins/unittest

  test:helm:
    desc: Helm chart unit tests
    deps: [helm:plugins]
    env:
      HELM_PLUGINS: .task/helm-plugins
    cmds:
      - helm unittest charts/simon-ostendorf.de

  build:
    desc: Compile the website binary
    deps: [web:build, prerender]
    cmds:
      - go build -o bin/website ./cmd/website

  test:go:
    desc: Go test
    deps: [web:build, prerender]
    cmds:
      - go test -race -count=1 ./...

  check:govue-version:
    desc: Verify go.mod and web/package.json pin the same govue version, and that the lockfile pins its subdirectory
    cmds:
      - go test -race -count=1 ./internal/depsync/...

  test:routes:
    desc: Route table conformance, the prerendered output against internal/routes' embedded table
    deps: [web:build, prerender]
    cmds:
      - go test -race -count=1 -run TestPrerenderedOutputMatchesRouteTable ./cmd/website/...

  # "task prerender" already ends with this check, so no build ships without it. This
  # target is the one CI's legal job runs: prerendering is the check, with its inputs.
  # It is not in "check", which runs prerender already.
  check:legal:
    desc: Prerender, which ends with govue-check-legal over the legal pages and their footer links
    cmds:
      - task: prerender

  web:deps:
    desc: Install the web/ dependencies
    dir: web
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: ESLint over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run lint

  web:format:
    desc: Prettier format check over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format:check

  web:types:
    desc: TypeScript and template typecheck of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run typecheck

  web:test:
    desc: Vitest suite of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run test

  web:build:
    desc: Build the SPA bundle into cmd/website/dist
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run build

  web:fmt:
    desc: Format the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format

  prerender:
    desc: Render every route of every locale to static HTML into cmd/website/prerendered
    dir: web
    deps: [web:build]
    cmds:
      - pnpm run prerender

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:golangci-config
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: lint:docker
      - task: lint:shell
      - task: lint:helm
      - task: validate:kubeconform
      - task: test:helm
      - task: web:lint
      - task: web:format
      - task: web:types
      - task: web:test
      - task: web:build
      - task: prerender
      - task: build
      - task: test:go
      - task: check:govue-version
      - task: test:routes

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
