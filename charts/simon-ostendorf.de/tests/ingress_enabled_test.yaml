suite: ingress enabled
templates:
  - templates/ingress.yaml
  - templates/httproute.yaml
set:
  ingress:
    enabled: true
    className: nginx
tests:
  - it: renders one Ingress with a rule for the canonical apex and one for its www alias, both routed to the same backend
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: simon-ostendorf.de
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-simon-ostendorf-de
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
      - equal:
          path: spec.rules[1].host
          value: www.simon-ostendorf.de
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.name
          value: RELEASE-NAME-simon-ostendorf-de
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.port.number
          value: 8080

  - it: renders one Ingress for a single, explicitly configured host
    template: templates/ingress.yaml
    set:
      ingress:
        hosts:
          - host: example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules
          value:
            - host: example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: RELEASE-NAME-simon-ostendorf-de
                        port:
                          number: 8080

  - it: routes only the public port, never govue's admin listener, even when the two differ from their defaults
    template: templates/ingress.yaml
    set:
      service:
        port: 9000
        adminPort: 9001
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9000
      - notEqual:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9001
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.port.number
          value: 9000
      - notEqual:
          path: spec.rules[1].http.paths[0].backend.service.port.number
          value: 9001

  - it: renders no HTTPRoute when ingress is the chosen route
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0
