{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "simon-ostendorf-de.serviceAccountName" . }}
  labels:
    {{- include "simon-ostendorf-de.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Set to true instead if the application makes Kubernetes API calls of its own and
# needs this token mounted.
automountServiceAccountToken: false
{{- end -}}
