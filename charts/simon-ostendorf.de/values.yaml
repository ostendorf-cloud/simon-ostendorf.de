# Default values for simon-ostendorf-de.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# No single-replica guard here, unlike a chart whose application keeps
# server-side session state in an in-process store: this site has none yet.
# See AGENTS.md.
replicaCount: 1

image:
  repository: ghcr.io/ostendorf-cloud/simon-ostendorf.de
  # Defaults to .Chart.AppVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # No RBAC is created: this application makes no Kubernetes API calls of its own.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Matches the Dockerfile's distroless "nonroot" base image, uid/gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Also used as the container port and for the probes: must match the port
  # encoded in config.addr (default ":8080" for both). This is the only
  # port the chart's own Ingress or HTTPRoute ever routes to.
  port: 8080
  # govue's admin listener: health, readiness and metrics, never routed by
  # this chart's own Ingress or HTTPRoute (templates/ingress.yaml and
  # templates/httproute.yaml only ever reference service.port above).
  # Reached only from inside the cluster, by a kubelet's probe or a
  # Prometheus ServiceMonitor/PodMonitor (not part of this chart). Must
  # match the port encoded in config.adminAddr (default ":8081" for both).
  adminPort: 8081

# Ingress and httpRoute below are two ways to reach this chart's own Service
# externally, chosen by their own enabled flag. Mutually exclusive (see
# templates/deployment.yaml's own fail guard): an install never renders
# both for the same hostname. Both default to false, so a default install
# renders no external route at all until one of the two is chosen.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # The apex is this site's canonical host; www.simon-ostendorf.de is a
  # second, live hostname that redirects to it (see AGENTS.md). Both are
  # listed here so the Ingress accepts and routes both, each to the same
  # backend below: this chart stays ingress-controller agnostic and ships
  # no baked-in redirect annotation, matching className and annotations
  # above, which are also left for the operator to fill in. An operator
  # who wants the Ingress itself to answer www with a 301 to the apex,
  # rather than serving it directly, adds their controller's own
  # redirect annotation through ingress.annotations.
  hosts:
    - host: simon-ostendorf.de
      paths:
        - path: /
          pathType: Prefix
    - host: www.simon-ostendorf.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API alternative to ingress above; see that block's own comment for
# the mutual-exclusion rule.
#
# The HTTPRoute and Gateway kinds are Gateway API CRDs. This chart never
# ships them (see kubernetes-conventions) and never creates the Gateway
# itself: both the CRDs and a running Gateway with a listener that allows
# this release's namespace are prerequisites, provisioned once per cluster,
# not by this chart.
httpRoute:
  enabled: false
  # Hostnames this HTTPRoute matches, mirroring ingress.hosts' host field.
  # A Gateway listener's own hostname (and allowedRoutes) still decides
  # whether traffic for one of these actually reaches this HTTPRoute; see
  # kubernetes-conventions.
  hostnames: []
  annotations: {}
  # Routing is fixed to this chart's own Service on service.port: no
  # values-driven way to add a second backend or a per-path rule, the same
  # single-backend shape ingress.hosts already assumes. An HTTPRoute rule
  # with no "matches" defaults to a "/" prefix match per the Gateway API
  # spec, the same default an Ingress with one "/" path rule gives.
  parentRefs:
    # Name of the Gateway this HTTPRoute attaches to. Required when
    # httpRoute.enabled is true.
    name: ""
    # Namespace the Gateway lives in. Required when httpRoute.enabled is
    # true: a Gateway is usually platform owned and lives in a different
    # namespace than this release, and Gateway API's own parentRefs
    # defaults an unset namespace to the HTTPRoute's own namespace, which
    # is normally wrong here. The Gateway's own allowedRoutes still decides
    # whether this reference is actually honoured.
    namespace: ""
    # Optional: the specific listener to attach to, when the Gateway
    # exposes more than one, for example separate HTTP and HTTPS
    # listeners.
    sectionName: ""

# The shutdown budget is about 28 seconds: 2 s readiness drain, up to 20 s for
# the server to finish requests, up to 5 s to send queued page views and 1 s
# of grace in govue's analytics Close. Keep this at 30 or more.
terminationGracePeriodSeconds: 30

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit: serving the SPA bundle is bursty on a page load, not
    # broken for being briefly busy. A memory limit stays in place as a
    # safety net against a genuine leak.
    memory: 128Mi

startupProbe:
  # Disabled by default: startup only loads the embedded frontend and
  # validates the configuration, neither of which is expected to be slow
  # enough to need one.
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Plain, non-secret configuration; this milestone has no secret-shaped
# setting at all, see AGENTS.md's Deviations.
config:
  addr: ":8080"
  # govue's admin listener (ADMIN_ADDR): health, readiness and metrics,
  # served separately from addr above; see service.adminPort and
  # templates/deployment.yaml's second container port and probes.
  adminAddr: ":8081"
  logLevel: "info"
  # Comma separated CIDRs of the reverse proxies (the ingress controller or
  # the Gateway) whose X-Forwarded-For header is believed (TRUSTED_PROXIES).
  # Page view counting needs it behind a proxy: with it empty every request
  # comes from the proxy's private address and no visitor is counted.
  trustedProxies: ""

# Page view counting with Umami, from the server. Off unless both url and
# websiteId are set; setting only one makes the pod fail at startup, by design. Neither is a secret:
# the url names an endpoint and the website id is not a credential.
umami:
  url: ""
  websiteId: ""
